- name: Limble MCP Server
  description: Official hosted Model Context Protocol server at https://mcp.limblecmms.com/mcp (Streamable HTTP) that exposes Limble CMMS data and actions to MCP clients (Cursor, Claude Desktop, Claude Code, GitHub Copilot, Microsoft Copilot Studio). Authenticated with the same client ID and secret as the REST API, sent as Limble-Client-ID / Limble-Client-Secret headers or as an HTTP Basic Authorization header; the tool list (help, get_current_customer_info, get_tasks, list_mcp_tools, ...) is only enumerable after authentication. Available on the Premium+ and Enterprise plans.
  humanURL: https://help.limblecmms.com/en/articles/12902567-limble-mcp-user-setup-guide
