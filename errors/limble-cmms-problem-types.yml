problem_types:
  - status: 400
    title: Data Validation Error
    detail: Malformed JSON input or incorrect data type; on PATCH /v2/po/{poID}/state also an invalid state transition.
    remediation: Fix the payload against the operation's documented parameter table; PO state can only move forward one step.
  - status: 401
    title: No Credentials Provided
    detail: Authorization header missing or not a valid Basic client ID:secret pair.
    remediation: "Send `Authorization: Basic base64(CLIENT_ID:CLIENT_SECRET)`; regenerate keys under Settings -> Configuration -> API Settings."
  - status: 403
    title: Forbidden
    detail: The resource cannot be accessed with this key.
    remediation: Check the key belongs to the right Limble account and region host (api / ca-api / au-api / eu-api / 21cfr-api).
  - status: 404
    title: Resource not found
    detail: The resource you are targeting does not exist.
  - status: 409
    title: Resource Conflict
    detail: A resource already exists with those parameters (declared on 95 operations, mostly creates and attachments).
  - status: 422
    title: Unprocessable Entity
    detail: Request is syntactically valid but semantically wrong - notably a `limit` above the endpoint's server-side maximum.
    remediation: Lower `limit`; a missing or non-positive limit defaults to 1000.
  - status: 429
    title: Too Many Requests
    detail: Per-minute or per-hour method quota exhausted.
    remediation: Read X-RateLimit-TTL / X-RateLimit-Minute-TTL and wait; see rate-limits/limble-solutions-rate-limits.yml.
  - status: 500
    title: Internal Server Error
    detail: Contact Limble for assistance.
  - status: 501
    title: Method Not Supported
    detail: Only GET, POST, PATCH, PUT and DELETE are supported; use the X-HTTP-Method-Override header on POST where a client cannot send PATCH/PUT.
success_codes:
  - status: 200
    note: PUT, PATCH and DELETE always return an empty 200 on success.
  - status: 201
    note: POST creates return 201 with a Location header carrying the GET URL of the new resource.
