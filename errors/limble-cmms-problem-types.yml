    Two body shapes coexist (components.schemas.ErrorResponse, oneOf): the standard `{ message, success?, raw? }`
    from the central error handler and most controllers, and the legacy `{ error, success, msg }` from the auth
    middleware (observed live: {"error":401,"success":false,"msg":"No Credentials Provided"}). Not RFC 9457.
